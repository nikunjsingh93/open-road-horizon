grid{grid-template-columns:1fr 1fr;gap:6px 36px;display:grid}@media (max-width:720px){.grid{grid-template-columns:1fr}}.sec{letter-spacing:3px;text-transform:uppercase;opacity:.5;border-bottom:1px solid var(--line);grid-column:1/-1;margin:16px 0 6px;padding-bottom:6px;font-size:11px}.row{justify-content:space-between;align-items:center;gap:14px;padding:6px 0;font-size:13.5px;display:flex}.row label{opacity:.85;white-space:nowrap}.row .val{opacity:.55;text-align:right;min-width:42px;font-size:12px}input[type=range]{appearance:none;background:#ffffff38;border-radius:2px;outline:none;width:170px;height:3px}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;cursor:pointer;background:#fff;border-radius:50%;width:14px;height:14px;box-shadow:0 1px 6px #00000080}.seg{flex-wrap:wrap;justify-content:flex-end;gap:4px;display:flex}.seg button,.btn{color:var(--fg);border:1px solid var(--line);font:inherit;cursor:pointer;background:#ffffff14;border-radius:8px;padding:5px 11px;font-size:12.5px;transition:background .15s}.seg button:hover,.btn:hover{background:#ffffff29}.seg button.on{background:var(--acc);color:#1a1408;border-color:var(--acc);font-weight:600}.sw{gap:8px;display:flex}.sw i{cursor:pointer;border:2px solid #0000;border-radius:50%;width:22px;height:22px;box-shadow:inset 0 0 0 1px #ffffff40}.sw i.on{border-color:#fff}.foot{opacity:.8;justify-content:space-between;align-items:center;margin-top:22px;font-size:12px;display:flex}#fps{top:max(3px, env(safe-area-inset-top));right:max(8px, env(safe-area-inset-right));z-index:30;letter-spacing:.5px;opacity:.8;pointer-events:none;text-shadow:0 1px 3px #000;background:#00000059;border-radius:4px;padding:1px 5px;font:600 10px/1.2 ui-monospace,Consolas,monospace;display:none;position:fixed}body.touch #fps{top:max(0px, env(safe-area-inset-top));font-size:9px}#stats{opacity:.7;white-space:pre;text-shadow:0 1px 4px #000;font:11px/1.5 ui-monospace,Consolas,monospace;display:none;position:fixed;top:64px;left:32px}</style>
