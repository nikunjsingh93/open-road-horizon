<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b0d10" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Open Road</title>
<style>
  :root { --fg: #eef3f8; --dim: rgba(238,243,248,.62); --glass: rgba(14,18,24,.62); --line: rgba(255,255,255,.14); --acc: #ffd38a; }
  html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--fg); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 0; right: 0; bottom: 0; padding: 22px 32px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; text-shadow: 0 1px 8px rgba(0,0,0,.55); transition: opacity .6s; }
  #hud.hidden, #topbar.hidden { opacity: 0; }
  #speed { font-size: 58px; font-weight: 200; letter-spacing: -1px; line-height: 1; }
  #speed small { font-size: 14px; letter-spacing: 3px; opacity: .65; margin-left: 8px; font-weight: 400; }
  #gear { font-size: 13px; letter-spacing: 3px; opacity: .72; margin-top: 8px; display: flex; gap: 12px; align-items: center; }
  #rpmbar { width: 110px; height: 3px; background: rgba(255,255,255,.18); border-radius: 2px; overflow: hidden; }
  #rpmbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #fff, var(--acc)); }
  #help { font-size: 12px; line-height: 1.85; text-align: right; opacity: .7; letter-spacing: .4px; }
  #help b { font-weight: 600; background: rgba(255,255,255,.14); padding: 1px 7px; border-radius: 4px; margin-right: 3px; }
  #topbar { position: fixed; top: 22px; left: 32px; right: 32px; display: flex; justify-content: space-between; pointer-events: none; text-shadow: 0 1px 8px rgba(0,0,0,.6); transition: opacity .6s; }
  #title { font-size: 12px; letter-spacing: 7px; text-transform: uppercase; opacity: .55; }
  #clock { font-size: 13px; letter-spacing: 2px; opacity: .75; text-align: right; line-height: 1.6; }
  #toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); font-size: 14px; letter-spacing: 1.5px; opacity: 0; transition: opacity .4s; text-shadow: 0 1px 8px rgba(0,0,0,.7); padding: 8px 18px; background: var(--glass); border-radius: 20px; backdrop-filter: blur(8px); border: 1px solid var(--line); }
  #loading { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 60%, #1b2a3a 0%, #0b0d10 70%); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px; transition: opacity 1.2s; z-index: 30; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .t { letter-spacing: 12px; font-size: 26px; font-weight: 200; text-transform: uppercase; padding-left: 12px; }
  #loading .s { letter-spacing: 3px; font-size: 12px; opacity: .55; text-transform: uppercase; min-height: 16px; }
  #loading .bar { width: 240px; height: 2px; background: rgba(255,255,255,.14); overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0%; background: #fff; transition: width .4s; }
  #start { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 22px; z-index: 25; background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,.05) 55%); cursor: pointer; }
  #start .t { letter-spacing: 16px; font-size: 44px; font-weight: 200; text-transform: uppercase; padding-left: 16px; text-shadow: 0 2px 30px rgba(0,0,0,.5); }
  #start .s { letter-spacing: 4px; font-size: 13px; opacity: .8; text-transform: uppercase; animation: pulse 2.4s ease-in-out infinite; }
  #start .k { font-size: 12px; opacity: .6; letter-spacing: 1px; text-align: center; line-height: 2; }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: .95 } }
  #menu { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 20; background: rgba(6,9,13,.42); backdrop-filter: blur(6px); }
  #menu.open { display: flex; }
  #pwrap { position: relative; width: min(860px, 94vw); }
  #xclose { position: absolute; top: 10px; right: 10px; z-index: 2; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.1); color: var(--fg); font-size: 17px; line-height: 1; cursor: pointer; }
  #xclose:hover { background: var(--acc); color: #1a1408; }
  #panel { width: 100%; box-sizing: border-box; max-height: 86vh; overflow: auto; background: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 26px 32px 30px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  #panel h1 { margin: 0 0 4px; font-weight: 200; letter-spacing: 8px; font-size: 20px; text-transform: uppercase; }
  #panel .sub { font-size: 12px; opacity: .55; letter-spacing: 1px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 36px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .sec { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; opacity: .5; margin: 16px 0 6px; grid-column: 1 / -1; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 6px 0; font-size: 13.5px; }
  .row label { opacity: .85; white-space: nowrap; }
  .row .val { opacity: .55; font-size: 12px; min-width: 42px; text-align: right; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 170px; height: 3px; background: rgba(255,255,255,.22); border-radius: 2px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; cursor: pointer; box-shadow: 0 1px 6px rgba(0,0,0,.5); }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .seg button, .btn { background: rgba(255,255,255,.08); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; font: inherit; font-size: 12.5px; cursor: pointer; transition: background .15s; }
  .seg button:hover, .btn:hover { background: rgba(255,255,255,.16); }
  .seg button.on { background: var(--acc); color: #1a1408; border-color: var(--acc); font-weight: 600; }
  .sw { display: flex; gap: 8px; }
  .sw i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
  .sw i.on { border-color: #fff; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; font-size: 12px; opacity: .8; }
  #fps { position: fixed; top: max(3px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); z-index: 30; font: 600 10px/1.2 ui-monospace, Consolas, monospace; letter-spacing: .5px; opacity: .8; pointer-events: none; display: none; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,.35); text-shadow: 0 1px 3px #000; }
  body.touch #fps { top: max(0px, env(safe-area-inset-top)); font-size: 9px; }
  #stats { position: fixed; top: 64px; left: 32px; font: 11px/1.5 ui-monospace, Consolas, monospace; opacity: .7; white-space: pre; display: none; text-shadow: 0 1px 4px #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="topbar"><div id="title">Open Road</div><div id="clock"></div></div>
<div id="toast"></div>
<div id="stats"></div>
<div id="fps"></div>
<div id="hud">
  <div><div id="speed">0<small id="unit">km/h</small></div><div id="gear"><span id="gearTxt">N</span><div id="rpmbar"><i id="rpmfill"></i></div></div></div>
  <div id="help"><b>W</b><b>A</b><b>S</b><b>D</b> drive &nbsp; <b>Space</b> handbrake<br><b>C</b> autopilot &nbsp; <b>V</b> camera &nbsp; <b>R</b> recover<br><b>Esc</b> settings &nbsp; <b>H</b> hide HUD &nbsp; <b>M</b> mute</div>
</div>
<div id="start">
  <div class="t">Open Road</div>
  <div class="s">Click or press any key to drive</div>
  <div class="k">Endless procedural roads &nbsp;·&nbsp; relax, cruise, explore<br>Headphones recommended</div>
</div>
<div id="menu"><div id="pwrap"><button id="xclose" aria-label="Close settings" title="Close (Esc)">✕</button><div id="panel"></div></div></div>
<div id="loading"><div class="t">Open Road</div><div class="bar"><i id="lbar"></i></div><div class="s" id="lstat">Generating world</div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
